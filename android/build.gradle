group = "ae.altkamul.webex_flutter_plugin"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
        maven { url 'https://devhub.cisco.com/artifactory/webexsdk/' }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://devhub.cisco.com/artifactory/webexsdk/' }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: 'kotlin-kapt'
apply from: "./resolve_dependencies.gradle"

android {
    compileSdk = 34

    if (project.android.hasProperty("namespace")) {
        namespace = "ae.altkamul.webex_flutter_plugin"
    }
    dataBinding { enabled = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdkVersion 24
        multiDexEnabled true
        targetSdkVersion 34

        // Only include arm64 to significantly reduce APK size
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    dependencies {
        // Webex SDK - core dependency
        implementation "com.ciscowebex:webexsdk:3.13.0"

        // UI essentials
        implementation 'com.google.android.material:material:1.12.0'
        implementation 'androidx.appcompat:appcompat:1.7.0'
        implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

        // Reactive programming (used in login flow)
        implementation "io.reactivex.rxjava2:rxjava:2.2.11"
        implementation "io.reactivex.rxjava2:rxandroid:2.1.1"

        // Dependency injection
        implementation "io.insert-koin:koin-core:2.2.3"
        implementation "io.insert-koin:koin-androidx-viewmodel:2.2.3"

        // Data binding compiler
        kapt 'com.android.databinding:compiler:3.1.4'

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
}
